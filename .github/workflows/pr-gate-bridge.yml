# This privileged default-branch workflow reads PR metadata and dispatches
# the trusted disposable coordinator after deterministic PR checks complete.
# It never checks out a PR commit, downloads PR artifacts, or executes PR code.
name: Sofa / PR hosted gate dispatch

on:
  workflow_run:
    workflows: [Sofa / PR deterministic checks]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: github.event.workflow_run.event == 'pull_request' && github.event.repository.full_name == 'kevinmartin/sofa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: sofa-gate-dispatch
      deployment: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Dispatch exact current PR identities
        env:
          SOFA_GATE_READ_TOKEN: ${{ github.token }}
          SOFA_GATE_APP_ID: ${{ secrets.SOFA_GATE_APP_ID }}
          SOFA_GATE_APP_PRIVATE_KEY: ${{ secrets.SOFA_GATE_APP_PRIVATE_KEY }}
        run: go run ./cmd/sofa-test gate-bridge
