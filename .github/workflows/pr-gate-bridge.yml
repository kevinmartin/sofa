name: sofa PR gate bridge

# This privileged workflow exists only on sofa's default branch. It reads
# GitHub PR metadata and dispatches the trusted disposable coordinator. It
# never checks out a PR commit, downloads PR artifacts, or executes PR code.
on:
  workflow_run:
    workflows: [sofa PR fast]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: github.event.workflow_run.event == 'pull_request' && github.event.repository.full_name == 'kevinmartin/sofa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: sofa-gate-dispatch
      deployment: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch bridge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Dispatch exact current PR identities
        env:
          SOFA_GATE_READ_TOKEN: ${{ github.token }}
          SOFA_GATE_APP_ID: ${{ secrets.SOFA_GATE_APP_ID }}
          SOFA_GATE_APP_PRIVATE_KEY: ${{ secrets.SOFA_GATE_APP_PRIVATE_KEY }}
        run: go run ./cmd/sofa-gate-bridge
