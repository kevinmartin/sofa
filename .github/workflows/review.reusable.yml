# Consumer entry point for one owner-requested repair on an already admitted PR.
# Admission pins the exact review and PR head; only a verified bundle may reach
# the separate publisher, which updates that same PR with an exact-head lease.
name: Sofa / Reusable bounded review repair

on:
  workflow_call:
    inputs:
      issue_number:
        description: Number of the admitted issue whose PR has owner feedback
        required: true
        type: number
      version:
        description: v0 channel, exact v0 release or full source SHA; omit for automatic v0 updates
        required: false
        default: ''
        type: string
    outputs:
      version:
        description: Exact release or source SHA selected by the admit job
        value: ${{ jobs.admit.outputs.version }}
    secrets:
      SOFA_PROJECTS_TOKEN:
        required: true
      SOFA_PUBLISH_TOKEN:
        required: false # Legacy publisher identity; an App can author reviewable PRs instead.
      SOFA_PUBLISH_APP_ID:
        required: false
      SOFA_PUBLISH_APP_PRIVATE_KEY:
        required: false

concurrency:
  group: sofa-review-repair-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  admit:
    name: Bind owner review to the published PR and reserve repair budget
    if: github.event_name == 'workflow_dispatch' && github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Only the trusted admission controller writes sofa-state.
      actions: read # Exact terminal-run proof before recovering an interruption.
      pull-requests: read
    outputs:
      version: ${{ steps.sofa.outputs.version || steps.sofa-source.outputs.version }}
      dispatch: ${{ steps.status.outputs.dispatch }}
    steps:
      - name: Check out trusted consumer configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Admit the exact owner review
        shell: bash
        env:
          SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
          SOFA_STATE_TOKEN: ${{ github.token }}
          SOFA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          mkdir -p transport
          ./sofa review-repair admit --config consumer/.sofa.yml \
            --issue "$SOFA_ISSUE_NUMBER" --out-dir transport
      - name: Record dispatch decision
        id: status
        shell: bash
        run: |
          if [[ -f transport/manifest.json ]] && [[ "$(jq -r '.dispatch' transport/status.json)" == true ]]; then
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Carry admitted review manifest
        if: steps.status.outputs.dispatch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sofa-review-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport/manifest.json
          if-no-files-found: error
          retention-days: 1

  execute:
    name: Produce bounded repair in isolated model worker
    needs: admit
    if: needs.admit.outputs.dispatch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Download admitted review manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofa-review-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Read exact published PR head
        id: head
        shell: bash
        run: |
          sha="$(jq -er '.repair.pr_head_sha' transport/manifest.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid repair PR head' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out published PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Verify source identities
        shell: bash
        env:
          SOFA_PR_HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          test "$(git -C consumer rev-parse HEAD)" = "$SOFA_PR_HEAD_SHA"
      - name: Fetch pinned Copilot ACP package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/copilot-package"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/github-copilot-linux-x64.tgz" \
            https://github.com/github/copilot-cli/releases/download/v1.0.86/github-copilot-1.0.86-linux-x64.tgz
          echo '53284019748ac198c3dbcf9ba17f0541c8fcaaee16e6c644eb0e7285cdfd6112  '"$RUNNER_TEMP/github-copilot-linux-x64.tgz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/github-copilot-linux-x64.tgz" -C "$RUNNER_TEMP/copilot-package"
          test -f "$RUNNER_TEMP/copilot-package/package/index.js"
      # Only the model token enters this container. Review text, manifest,
      # toolkit, and harness are read-only; the candidate checkout is writable.
      - name: Run isolated review-repair worker
        shell: bash
        env:
          SOFA_MODEL_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --pids-limit 128 --memory 3g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/sofa:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$PWD/consumer,dst=/workspace" \
            --mount "type=bind,src=$PWD/transport,dst=/transport,readonly" \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate" \
            --mount "type=bind,src=$RUNNER_TEMP/sofa-cli,dst=/toolkit,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/copilot-package,dst=/copilot-package,readonly" \
            --env SOFA_MODEL_TOKEN \
            --env HOME=/home/sofa \
            --env PATH=/toolkit:/usr/local/bin:/usr/bin:/bin \
            node:24-bookworm@sha256:b977d0f785d96029d8d4c0790b6bf1c2a4c72e0f26319808e7ba2e9d966a1ac3 \
            /toolkit/sofa review-repair execute --config /workspace/.sofa.yml \
              --manifest /transport/manifest.json --workspace /workspace \
              --out /candidate/bundle.json
      - name: Carry repair bundle to secretless verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sofa-review-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/bundle.json
            candidate/execution.json
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify exact repair with secretless consumer checks
    needs: execute
    if: always() && needs.execute.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download admitted review manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofa-review-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Download untrusted repair bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofa-review-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Read exact published PR head
        id: head
        shell: bash
        run: |
          sha="$(jq -er '.repair.pr_head_sha' transport/manifest.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid repair PR head' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out published PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Verify verifier source identities
        shell: bash
        env:
          SOFA_PR_HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          test "$(git -C consumer rev-parse HEAD)" = "$SOFA_PR_HEAD_SHA"
      - name: Verify repair candidate without secrets
        shell: bash
        run: |
          mkdir -p evidence
          ./sofa review-repair verify --config consumer/.sofa.yml \
            --manifest transport/manifest.json --workspace "$PWD/consumer" \
            --bundle candidate/bundle.json --out evidence/checks.json
      - name: Carry trusted check evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sofa-review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/checks.json
          if-no-files-found: error
          retention-days: 1
      - name: Carry verified repair bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sofa-review-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/bundle.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Revalidate authority and update the same draft PR
    needs: verify
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Download admitted review manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofa-review-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Download verified repair bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofa-review-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Download trusted check evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofa-review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Read admitted configuration commit
        id: base
        shell: bash
        run: |
          sha="$(jq -er '.admission.base_sha' transport/manifest.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid admitted configuration commit' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out admitted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Verify publisher source identities
        shell: bash
        env:
          SOFA_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          test "$(git -C consumer rev-parse HEAD)" = "$SOFA_BASE_SHA"
      - name: Select publisher identity
        id: publisher-auth
        shell: bash
        env:
          SOFA_HAS_APP_ID: ${{ secrets.SOFA_PUBLISH_APP_ID != '' }}
          SOFA_HAS_APP_KEY: ${{ secrets.SOFA_PUBLISH_APP_PRIVATE_KEY != '' }}
          SOFA_HAS_LEGACY_TOKEN: ${{ secrets.SOFA_PUBLISH_TOKEN != '' }}
        run: |
          if [[ "$SOFA_HAS_APP_ID" == true && "$SOFA_HAS_APP_KEY" == true ]]; then
            echo 'mode=app' >> "$GITHUB_OUTPUT"
          elif [[ "$SOFA_HAS_APP_ID" == true || "$SOFA_HAS_APP_KEY" == true ]]; then
            echo 'publisher App ID and private key must be configured together' >&2
            exit 1
          elif [[ "$SOFA_HAS_LEGACY_TOKEN" == true ]]; then
            echo 'mode=legacy' >> "$GITHUB_OUTPUT"
          else
            echo 'publisher credential unavailable' >&2
            exit 1
          fi
      # Only this trusted publisher sees the repository-scoped installation
      # token; the worker, verifier, and failure finalizer keep their boundaries.
      - name: Mint repository-scoped publisher App token
        if: steps.publisher-auth.outputs.mode == 'app'
        id: publisher-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SOFA_PUBLISH_APP_ID }}
          private-key: ${{ secrets.SOFA_PUBLISH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # The command re-reads the Project, approved spec, owner review, PR, and
      # ledger fence before a leased push; no model or candidate code runs here.
      - name: Publish verified repair on the same PR with App
        if: steps.publisher-auth.outputs.mode == 'app'
        shell: bash
        env:
          SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
          SOFA_PUBLISH_TOKEN: ${{ steps.publisher-app.outputs.token }}
          SOFA_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ./sofa review-repair publish --config consumer/.sofa.yml \
            --manifest transport/manifest.json --bundle candidate/bundle.json \
            --evidence evidence/checks.json --base-branch "$SOFA_BASE_BRANCH"
      - name: Publish verified repair on the same PR with legacy token
        if: steps.publisher-auth.outputs.mode == 'legacy'
        shell: bash
        env:
          SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
          SOFA_PUBLISH_TOKEN: ${{ secrets.SOFA_PUBLISH_TOKEN }}
          SOFA_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ./sofa review-repair publish --config consumer/.sofa.yml \
            --manifest transport/manifest.json --bundle candidate/bundle.json \
            --evidence evidence/checks.json --base-branch "$SOFA_BASE_BRANCH"

  finalize-failure:
    name: Record bounded repair failure without model or publisher credentials
    needs: [admit, execute, verify, publish]
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.dispatch == 'true' && (contains(fromJSON('["failure","cancelled"]'), needs.execute.result) || contains(fromJSON('["failure","cancelled"]'), needs.verify.result) || contains(fromJSON('["failure","cancelled"]'), needs.publish.result))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Only the trusted finalizer writes sofa-state.
    steps:
      - name: Download admitted review manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofa-review-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Read admitted configuration commit
        id: base
        shell: bash
        run: |
          sha="$(jq -er '.admission.base_sha' transport/manifest.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid admitted configuration commit' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out admitted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Verify finalizer source identities
        shell: bash
        env:
          SOFA_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          test "$(git -C consumer rev-parse HEAD)" = "$SOFA_BASE_SHA"
      - name: Record bounded repair-stage failure
        shell: bash
        env:
          SOFA_STATE_TOKEN: ${{ github.token }}
          SOFA_EXECUTE_RESULT: ${{ needs.execute.result }}
          SOFA_VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$SOFA_EXECUTE_RESULT" != success ]]; then
            stage=execute
          elif [[ "$SOFA_VERIFY_RESULT" != success ]]; then
            stage=verify
          else
            stage=publish
          fi
          ./sofa review-repair fail --config consumer/.sofa.yml \
            --manifest transport/manifest.json --stage "$stage"
