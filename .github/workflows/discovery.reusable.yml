# The caller dispatches this workflow only for an issue currently in the
# designated private Project's Discovery status. This workflow independently
# re-reads that status, reserves one prompt, and never sets Backlog or Ready.
name: Sofa / Reusable Discovery specification

on:
  workflow_call:
    inputs:
      version:
        description: v0 channel, exact v0 release or full source SHA; omit for automatic v0 updates
        required: false
        default: ''
        type: string
      issue_number:
        description: Issue to research after trusted Project admission
        required: true
        type: number
    outputs:
      version:
        description: Exact release or source SHA selected by the admit job
        value: ${{ jobs.admit.outputs.version }}
    secrets:
      SOFA_PROJECTS_TOKEN:
        required: true

jobs:
  admit:
    name: Reserve a bounded Discovery turn
    if: github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # CAS on consumer-owned sofa-state; no default-branch write.
      issues: read
      actions: read # Terminal run proof for interrupted-turn recovery.
    outputs:
      version: ${{ steps.sofa.outputs.version || steps.sofa-source.outputs.version }}
      dispatch: ${{ steps.decision.outputs.dispatch }}
      recovery_run_id: ${{ steps.decision.outputs.recovery_run_id }}
      recovery_attempt: ${{ steps.decision.outputs.recovery_attempt }}
    steps:
      - name: Validate trusted workflow inputs
        shell: bash
        env:
          SOFA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          [[ "$SOFA_ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'issue_number must be positive' >&2; exit 1; }
      - name: Check out current consumer default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Re-read private Project and claim one prompt
        shell: bash
        env:
          SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
          SOFA_STATE_TOKEN: ${{ github.token }}
          SOFA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          mkdir -p transport
          ./sofa discovery admit --config consumer/.sofa.yml --issue "$SOFA_ISSUE_NUMBER" \
            --workspace "$PWD/consumer" --out-dir transport
      - name: Export bounded decision
        id: decision
        shell: bash
        run: |
          jq -e '.dispatch | type == "boolean"' transport/status.json >/dev/null
          echo "dispatch=$(jq -r '.dispatch' transport/status.json)" >> "$GITHUB_OUTPUT"
          if [[ "$(jq -r '.dispatch' transport/status.json)" == true ]]; then
            run_id="$(jq -r '.recovery_run_id // empty' transport/status.json)"
            attempt="$(jq -r '.recovery_run_attempt // empty' transport/status.json)"
            if [[ -n "$run_id" ]]; then
              [[ "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            fi
            echo "recovery_run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "recovery_attempt=$attempt" >> "$GITHUB_OUTPUT"
          fi
      - name: Carry admitted manifest to isolated stages
        if: steps.decision.outputs.dispatch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sofa-discovery-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport/manifest.json
          if-no-files-found: error
          retention-days: 1

  generate:
    name: Generate specification with model-only credential
    needs: admit
    if: needs.admit.outputs.dispatch == 'true' && needs.admit.outputs.recovery_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Download exact admission
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-discovery-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Fetch pinned Copilot ACP package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/copilot-package"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/github-copilot-linux-x64.tgz" \
            https://github.com/github/copilot-cli/releases/download/v1.0.86/github-copilot-1.0.86-linux-x64.tgz
          echo '53284019748ac198c3dbcf9ba17f0541c8fcaaee16e6c644eb0e7285cdfd6112  '"$RUNNER_TEMP/github-copilot-linux-x64.tgz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/github-copilot-linux-x64.tgz" -C "$RUNNER_TEMP/copilot-package"
          test -f "$RUNNER_TEMP/copilot-package/package/index.js"
      # No Project, state, or comment credential enters the container. The
      # model sees only the admitted idea and deterministic repository facts.
      - name: Run isolated Discovery worker
        shell: bash
        env:
          SOFA_MODEL_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --pids-limit 128 --memory 3g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/sofa:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$PWD/transport,dst=/transport,readonly" \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate" \
            --mount "type=bind,src=$RUNNER_TEMP/sofa-cli,dst=/toolkit,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/copilot-package,dst=/copilot-package,readonly" \
            --env SOFA_MODEL_TOKEN \
            --env HOME=/home/sofa \
            --env PATH=/toolkit:/usr/local/bin:/usr/bin:/bin \
            node:24-bookworm@sha256:b977d0f785d96029d8d4c0790b6bf1c2a4c72e0f26319808e7ba2e9d966a1ac3 \
            /toolkit/sofa discovery generate --manifest /transport/manifest.json --out /candidate/specification.json
      - name: Carry bounded candidate to trusted publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sofa-discovery-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/specification.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Revalidate and post unapproved specification
    needs: [admit, generate]
    if: always() && needs.admit.outputs.dispatch == 'true' && (needs.generate.result == 'success' || (needs.generate.result == 'skipped' && needs.admit.outputs.recovery_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Consumer state ledger only.
      issues: write # One versioned, unapproved specification comment.
      actions: read # Exact retained candidate on interrupted publication.
    steps:
      - name: Download exact admission
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-discovery-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Download current candidate
        if: needs.admit.outputs.recovery_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-discovery-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Download retained candidate from proven terminal run
        if: needs.admit.outputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-discovery-candidate-${{ needs.admit.outputs.recovery_run_id }}-${{ needs.admit.outputs.recovery_attempt }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.admit.outputs.recovery_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Check out current consumer configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Re-read issue and Project before publication
        shell: bash
        env:
          SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
          SOFA_STATE_TOKEN: ${{ github.token }}
          SOFA_COMMENT_TOKEN: ${{ github.token }}
        run: |
          ./sofa discovery publish --config consumer/.sofa.yml \
            --manifest transport/manifest.json --candidate candidate/specification.json

  finalize-failure:
    name: Bound a failed Discovery turn
    needs: [admit, generate, publish]
    if: always() && needs.admit.outputs.dispatch == 'true' && (contains(fromJSON('["failure","cancelled"]'), needs.generate.result) || contains(fromJSON('["failure","cancelled"]'), needs.publish.result))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exact admission
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-discovery-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Check out trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: consumer
      - name: Record bounded infrastructure failure
        shell: bash
        env:
          SOFA_STATE_TOKEN: ${{ github.token }}
        run: |
          ./sofa discovery fail --config consumer/.sofa.yml --manifest transport/manifest.json --kind infrastructure
