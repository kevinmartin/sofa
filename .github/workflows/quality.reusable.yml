# Secretless checks for sofa and its consumers. Triggers belong to callers.
name: Sofa / reusable quality

on:
  workflow_call:
    inputs:
      profiles:
        description: Comma-separated go, typescript, react; empty auto-detects manifests
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  autodetect:
    if: inputs.profiles == '' || inputs.profiles == 'auto'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      profiles: ${{ steps.detect.outputs.profiles }}
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Detect quality profiles
        id: detect
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          selected = []
          if Path('go.mod').is_file():
              selected.append('go')
          if Path('package.json').is_file() and Path('tsconfig.json').is_file():
              package = json.loads(Path('package.json').read_text())
              selected.append('typescript')
              dependencies = {**package.get('dependencies', {}), **package.get('devDependencies', {})}
              if 'react' in dependencies:
                  selected.append('react')
          if not selected:
              raise SystemExit('no supported quality profile detected')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('profiles=' + ','.join(selected) + '\n')
          PY

  select:
    needs: autodetect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.select.outputs.go }}
      node: ${{ steps.select.outputs.node }}
      react: ${{ steps.select.outputs.react }}
      package-manager: ${{ steps.select.outputs.package-manager }}
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select and validate quality profiles
        id: select
        shell: bash
        env:
          SOFA_PROFILES: ${{ inputs.profiles }}
          DETECTED_PROFILES: ${{ needs.autodetect.outputs.profiles }}
          AUTODETECT_RESULT: ${{ needs.autodetect.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          requested = os.environ['SOFA_PROFILES'].strip().lower()
          automatic = requested in ('', 'auto')
          if automatic and os.environ['AUTODETECT_RESULT'] != 'success':
              raise SystemExit('quality profile detection failed')
          if not automatic and os.environ['AUTODETECT_RESULT'] != 'skipped':
              raise SystemExit('unexpected quality profile detection')
          raw = os.environ['DETECTED_PROFILES'] if automatic else requested
          parts = raw.split(',')
          selected = set(parts)
          if len(parts) != len(selected) or any(p not in {'go', 'typescript', 'react'} for p in parts):
              raise SystemExit('invalid quality profiles')
          if 'go' in selected and not Path('go.mod').is_file():
              raise SystemExit('go profile requires go.mod')
          if 'react' in selected:
              selected.add('typescript')
          manager = ''
          if 'typescript' in selected:
              if not Path('package.json').is_file() or not Path('tsconfig.json').is_file():
                  raise SystemExit('typescript profile requires package.json and tsconfig.json')
              package = json.loads(Path('package.json').read_text())
              locks = {'npm': 'package-lock.json', 'pnpm': 'pnpm-lock.yaml', 'yarn': 'yarn.lock'}
              found = [name for name, path in locks.items() if Path(path).is_file()]
              if len(found) != 1:
                  raise SystemExit('typescript profile requires exactly one supported lockfile')
              manager = found[0]
              declared = package.get('packageManager', '')
              if declared and declared.split('@', 1)[0] != manager:
                  raise SystemExit('packageManager disagrees with lockfile')
              if manager != 'npm' and not declared:
                  raise SystemExit('pnpm and yarn require a pinned packageManager')
              scripts = package.get('scripts', {})
              required = ['format:check', 'lint', 'typecheck', 'test']
              if 'react' in selected:
                  required.append('build')
              missing = [name for name in required if not scripts.get(name)]
              if missing:
                  raise SystemExit('missing required package scripts: ' + ', '.join(missing))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"go={str('go' in selected).lower()}\n")
              output.write(f"node={str('typescript' in selected).lower()}\n")
              output.write(f"react={str('react' in selected).lower()}\n")
              output.write(f'package-manager={manager}\n')
          print('Selected quality profiles: ' + ', '.join(sorted(selected)))
          PY

  go:
    needs: select
    if: needs.select.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go formatting and module files
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          go mod tidy -diff
      - name: Install pinned Go analyzer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/staticcheck.tar.gz" \
            https://github.com/dominikh/go-tools/releases/download/2026.2.1/staticcheck_linux_amd64.tar.gz
          printf '%s  %s\n' \
            91186205a78db3f2d40efb3c102749aef66f85c2204793de7488d163b655aa7c \
            "$RUNNER_TEMP/staticcheck.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/sofa-linters"
          tar -xzf "$RUNNER_TEMP/staticcheck.tar.gz" -C "$RUNNER_TEMP/sofa-linters" staticcheck/staticcheck
          printf '%s\n' "$RUNNER_TEMP/sofa-linters/staticcheck" >> "$GITHUB_PATH"
      - name: Run Go tests, vet, and Staticcheck
        shell: bash
        run: |
          go test -count=1 ./...
          go vet ./...
          staticcheck ./...

  typescript-react:
    needs: select
    if: needs.select.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.8.0'
          package-manager-cache: false
      - name: Install locked Node dependencies
        shell: bash
        env:
          SOFA_PACKAGE_MANAGER: ${{ needs.select.outputs.package-manager }}
        run: |
          set -euo pipefail
          case "$SOFA_PACKAGE_MANAGER" in
            npm) npm ci --ignore-scripts ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile --ignore-scripts ;;
            yarn) corepack enable && yarn install --immutable --mode=skip-builds ;;
            *) exit 1 ;;
          esac
      - name: Check TypeScript and React
        shell: bash
        env:
          SOFA_PACKAGE_MANAGER: ${{ needs.select.outputs.package-manager }}
          SOFA_REACT: ${{ needs.select.outputs.react }}
        run: |
          set -euo pipefail
          for script in format:check lint typecheck test; do
            "$SOFA_PACKAGE_MANAGER" run "$script"
          done
          if [[ "$SOFA_REACT" == true ]]; then
            "$SOFA_PACKAGE_MANAGER" run build
          fi

  github-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned workflow linter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sofa-linters"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/sofa-linters" actionlint
          printf '%s\n' "$RUNNER_TEMP/sofa-linters" >> "$GITHUB_PATH"
      - name: Lint workflows and embedded shell
        shell: bash
        run: |
          command -v shellcheck
          actionlint
      - name: Set up Go for managed template validation
        if: github.repository == 'kevinmartin/sofa'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint rendered managed callers
        if: github.repository == 'kevinmartin/sofa'
        shell: bash
        run: go test ./internal/managedconfig -run TestActionlintRenderedCallers -count=1

  result:
    needs: [select, go, typescript-react, github-actions]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every selected quality job
        shell: bash
        env:
          SOFA_SELECT_RESULT: ${{ needs.select.result }}
          SOFA_GO_SELECTED: ${{ needs.select.outputs.go }}
          SOFA_NODE_SELECTED: ${{ needs.select.outputs.node }}
          SOFA_GO_RESULT: ${{ needs.go.result }}
          SOFA_NODE_RESULT: ${{ needs.typescript-react.result }}
          SOFA_ACTIONS_RESULT: ${{ needs.github-actions.result }}
        run: |
          set -euo pipefail
          [[ "$SOFA_SELECT_RESULT" == success && "$SOFA_ACTIONS_RESULT" == success ]]
          if [[ "$SOFA_GO_SELECTED" == true ]]; then
            [[ "$SOFA_GO_RESULT" == success ]]
          else
            [[ "$SOFA_GO_RESULT" == skipped ]]
          fi
          if [[ "$SOFA_NODE_SELECTED" == true ]]; then
            [[ "$SOFA_NODE_RESULT" == success ]]
          else
            [[ "$SOFA_NODE_RESULT" == skipped ]]
          fi
