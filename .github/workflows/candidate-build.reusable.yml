# Candidate source is built once without model, Project, or publication secrets.
# Reconcile prepares this invocation's artifact before work consumes it; standalone
# lifecycle, Discovery, and review workflows prepare their own invocation artifact.
name: Sofa / Reusable candidate CLI build

on:
  workflow_call:
    inputs:
      toolkit_sha:
        description: Full lowercase Sofa source commit SHA
        required: true
        type: string
      release_version:
        description: Must be empty when building candidate source
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate mutually exclusive binary selection
        shell: bash
        env:
          SOFA_TOOLKIT_SHA: ${{ inputs.toolkit_sha }}
          SOFA_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          [[ "$SOFA_TOOLKIT_SHA" =~ ^[0-9a-f]{40}$ && -z "$SOFA_RELEASE_VERSION" ]] || exit 1
      - name: Check out exact candidate source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.toolkit_sha }}
          persist-credentials: false
          path: toolkit
      - name: Verify checkout identity
        shell: bash
        env:
          SOFA_TOOLKIT_SHA: ${{ inputs.toolkit_sha }}
        run: |
          test "$(git -C toolkit rev-parse HEAD)" = "$SOFA_TOOLKIT_SHA"
          test -z "$(git -C toolkit status --porcelain)"
      - name: Set up Go for candidate build only
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolkit/go.mod
          cache: false
      - name: Build both candidate CLIs
        shell: bash
        env:
          SOFA_TOOLKIT_SHA: ${{ inputs.toolkit_sha }}
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p binaries
          ldflags="-X github.com/kevinmartin/sofa/internal/version.Version=development -X github.com/kevinmartin/sofa/internal/version.SourceCommit=$SOFA_TOOLKIT_SHA"
          (cd toolkit && go build -trimpath -buildvcs=true -ldflags "$ldflags" -o ../binaries/sofa ./cmd/sofa && go build -trimpath -buildvcs=true -ldflags "$ldflags" -o ../binaries/sofa-test ./cmd/sofa-test)
          jq -n --arg sha "$SOFA_TOOLKIT_SHA" '{schema:"sofa-candidate-cli-v1",source_sha:$sha}' > binaries/manifest.json
          (cd binaries && sha256sum sofa sofa-test manifest.json > manifest.sha256)
      - name: Carry binaries only within this invocation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofa-cli-${{ inputs.toolkit_sha }}-${{ github.run_id }}
          path: binaries/
          overwrite: true # A full rerun rebuilds this same exact source; partial reruns reuse it.
          if-no-files-found: error
          retention-days: 1
