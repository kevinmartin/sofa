# Consumer entry point after reconcile.reusable.yml emits dispatch=true. Pin
# reusable workflows to @v0, or use matching exact workflow/source SHAs for tests.
# Each CLI job installs its selected version through the shared setup Action.
# Jobs form separate trust boundaries: the worker proposes data, verification
# runs consumer checks without secrets, and only the publisher can create a PR.
name: Sofa / Reusable candidate execution and publication

on:
  workflow_call:
    inputs:
      version:
        description: v0 channel, exact v0 release or full source SHA; omit for automatic v0 updates
        required: false
        default: ''
        type: string
      reconcile_publication:
        description: Reuse a prior candidate after interrupted publication
        required: false
        default: false
        type: boolean
      reconcile_candidate:
        description: Reverify an accepted candidate from a prior terminal run
        required: false
        default: false
        type: boolean
    outputs:
      version:
        description: Exact release or source SHA selected by the publish job
        value: ${{ jobs.publish.outputs.version }}
    secrets:
      SOFA_PROJECTS_TOKEN:
        required: true
      SOFA_PUBLISH_TOKEN:
        required: false # Legacy publisher identity; an App can author reviewable PRs instead.
      SOFA_PUBLISH_APP_ID:
        required: false
      SOFA_PUBLISH_APP_PRIVATE_KEY:
        required: false

# The caller invokes this only when reconcile emitted dispatch=true. Recovery
# fetches only the prior run/attempt identified by the admitted manifest.
jobs:
  execute:
    name: Produce bounded candidate in isolated worker
    # Retained candidates bypass execution and therefore consume no new prompt.
    if: github.event_name == 'workflow_dispatch' && github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.reconcile_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Download admitted manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Read admitted base commit
        id: base
        shell: bash
        run: |
          sha="$(jq -er '.grant.base_sha' transport/manifest.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid admitted base commit' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out admitted consumer commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Verify source identities
        shell: bash
        env:
          SOFA_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          test "$(git -C consumer rev-parse HEAD)" = "$SOFA_BASE_SHA"
      - name: Fetch pinned Copilot ACP package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/copilot-package"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/github-copilot-linux-x64.tgz" \
            https://github.com/github/copilot-cli/releases/download/v1.0.86/github-copilot-1.0.86-linux-x64.tgz
          echo '53284019748ac198c3dbcf9ba17f0541c8fcaaee16e6c644eb0e7285cdfd6112  '"$RUNNER_TEMP/github-copilot-linux-x64.tgz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/github-copilot-linux-x64.tgz" -C "$RUNNER_TEMP/copilot-package"
          test -f "$RUNNER_TEMP/copilot-package/package/index.js"
      # Only the model token enters this container. The consumer checkout and
      # candidate directory are writable; toolkit, harness, and manifest are not.
      # Harness-native tools can edit the checkout, so candidate path/size policy
      # is enforced again by the separate verifier and publisher.
      - name: Run isolated candidate worker
        shell: bash
        env:
          SOFA_MODEL_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --pids-limit 128 --memory 3g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/sofa:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$PWD/consumer,dst=/workspace" \
            --mount "type=bind,src=$PWD/transport,dst=/transport,readonly" \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate" \
            --mount "type=bind,src=$RUNNER_TEMP/sofa-cli,dst=/toolkit,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/copilot-package,dst=/copilot-package,readonly" \
            --env SOFA_MODEL_TOKEN \
            --env HOME=/home/sofa \
            --env PATH=/toolkit:/usr/local/bin:/usr/bin:/bin \
            node:24-bookworm@sha256:b977d0f785d96029d8d4c0790b6bf1c2a4c72e0f26319808e7ba2e9d966a1ac3 \
            /toolkit/sofa execute --config /workspace/.sofa.yml \
              --manifest /transport/manifest.json --workspace /workspace \
              --out /candidate/bundle.json
      - name: Preserve sanitized execution failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofa-execution-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/execution-failure.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Carry candidate bundle to secretless verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofa-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/bundle.json
            candidate/execution.json
          if-no-files-found: error
          retention-days: 1

  finalize-failure:
    name: Record sanitized execution or verification failure
    # Wait for both stages, including an intentional execution skip on recovery.
    # Only bounded failure categories enter the ledger, never raw model output.
    needs: [execute, verify]
    if: always() && (needs.execute.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download admitted manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Download sanitized failure, when produced
        if: needs.execute.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-execution-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: failure
      - name: Download sanitized verification failure, when produced
        if: needs.verify.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-verification-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: failure
      # A runner/download/setup failure may precede command-level diagnostics.
      # Preserve a verification diagnosis first, then an execution diagnosis;
      # otherwise record a fenced infrastructure failure for bounded recovery.
      - name: Build bounded infrastructure fallback
        shell: bash
        run: |
          if [[ -f failure/verification-failure.json ]]; then
            cp failure/verification-failure.json failure/failure.json
          elif [[ -f failure/execution-failure.json ]]; then
            cp failure/execution-failure.json failure/failure.json
          else
            mkdir -p failure
            jq -n --arg id "$(jq -er '.fence.attempt_id' transport/manifest.json)" \
              --argjson gen "$(jq -er '.fence.generation' transport/manifest.json)" \
              '{version:1,attempt_id:$id,generation:$gen,kind:"infrastructure"}' \
              > failure/failure.json
          fi
      - name: Read admitted base commit
        id: base
        shell: bash
        run: |
          sha="$(jq -er '.grant.base_sha' transport/manifest.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid admitted base commit' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out admitted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Record the bounded failure
        shell: bash
        env:
          SOFA_STATE_TOKEN: ${{ github.token }}
        run: |
          ./sofa fail --config consumer/.sofa.yml \
            --manifest transport/manifest.json \
            --failure failure/failure.json

  verify:
    name: Verify exact candidate with secretless consumer checks
    # Recovery fetches only the producer recorded in the admitted manifest and
    # rechecks the retained bytes under the current fence, without another model.
    needs: execute
    if: always() && (needs.execute.result == 'success' || (needs.execute.result == 'skipped' && inputs.reconcile_candidate))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # Only used by download-artifact for a prior run on recovery.
    steps:
      - name: Download admitted manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Read recovery artifact identity
        if: inputs.reconcile_candidate
        id: recovery
        shell: bash
        run: |
          run_id="$(jq -er '.recovery_source.run_id' transport/manifest.json)"
          attempt="$(jq -er '.recovery_source.run_attempt' transport/manifest.json)"
          [[ "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]] || { echo 'invalid recovery run identity' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
      - name: Download current candidate bundle
        if: '!inputs.reconcile_candidate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Download retained candidate bundle
        if: inputs.reconcile_candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-verified-candidate-${{ steps.recovery.outputs.run_id }}-${{ steps.recovery.outputs.attempt }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.recovery.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Read admitted base commit
        id: base
        shell: bash
        run: |
          sha="$(jq -er '.grant.base_sha' transport/manifest.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid admitted base commit' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out admitted consumer commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Verify candidate and run configured checks without secrets
        shell: bash
        run: |
          test "$(git -C consumer rev-parse HEAD)" = "${{ steps.base.outputs.sha }}"
          mkdir -p evidence
          ./sofa verify --config consumer/.sofa.yml \
            --manifest transport/manifest.json --workspace "$PWD/consumer" \
            --bundle candidate/bundle.json --out evidence/checks.json
      - name: Preserve sanitized verification failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofa-verification-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/verification-failure.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Carry trusted evidence to publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofa-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/checks.json
          if-no-files-found: error
          retention-days: 1
      - name: Carry verified candidate to publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofa-verified-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/bundle.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Revalidate authority and publish one draft pull request
    # This job reads candidate data but never executes candidate code. It alone
    # receives the publisher credential for fenced ledger, branch, and PR writes.
    needs: verify
    # A recovered candidate skips execute. Explicit always() prevents GitHub's
    # implicit success() from treating that intentional skip as a failed chain.
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.sofa.outputs.version || steps.sofa-source.outputs.version }}
    steps:
      - name: Download admitted manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport
      - name: Download verified candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-verified-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Download trusted check evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sofa-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Read admitted base commit
        id: base
        shell: bash
        run: |
          sha="$(jq -er '.grant.base_sha' transport/manifest.json)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid admitted base commit' >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out admitted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
          path: consumer
      # Explicit SHA mode always loads this Action from the selected source.
      # It works before and after v0 activation; release mode follows below.
      - name: Validate exact source selector before loading its installer
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        env:
          SOFA_VERSION: ${{ inputs.version }}
        run: '[[ "$SOFA_VERSION" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out exact source installer without credentials
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevinmartin/sofa
          ref: ${{ inputs.version }}
          path: .sofa-cli-source
          persist-credentials: false
      - name: Set up source Sofa CLIs
        if: inputs.version != '' && !startsWith(inputs.version, 'v')
        id: sofa-source
        uses: ./.sofa-cli-source/.github/actions/setup-cli
        with:
          version: ${{ inputs.version }}
          major: v0
      - name: Set up released Sofa CLIs
        if: inputs.version == '' || startsWith(inputs.version, 'v')
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          major: v0
          version: ${{ inputs.version }}
      - name: Expose job binaries for existing CLI commands
        shell: bash
        run: ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
      - name: Verify publisher source identity
        shell: bash
        run: |
          test "$(git -C consumer rev-parse HEAD)" = "${{ steps.base.outputs.sha }}"
      - name: Select publisher identity
        id: publisher-auth
        shell: bash
        env:
          SOFA_HAS_APP_ID: ${{ secrets.SOFA_PUBLISH_APP_ID != '' }}
          SOFA_HAS_APP_KEY: ${{ secrets.SOFA_PUBLISH_APP_PRIVATE_KEY != '' }}
          SOFA_HAS_LEGACY_TOKEN: ${{ secrets.SOFA_PUBLISH_TOKEN != '' }}
        run: |
          if [[ "$SOFA_HAS_APP_ID" == true && "$SOFA_HAS_APP_KEY" == true ]]; then
            echo 'mode=app' >> "$GITHUB_OUTPUT"
          elif [[ "$SOFA_HAS_APP_ID" == true || "$SOFA_HAS_APP_KEY" == true ]]; then
            echo 'publisher App ID and private key must be configured together' >&2
            exit 1
          elif [[ "$SOFA_HAS_LEGACY_TOKEN" == true ]]; then
            echo 'mode=legacy' >> "$GITHUB_OUTPUT"
          else
            echo 'publisher credential unavailable' >&2
            exit 1
          fi
      # The installation token is restricted to this consumer repository and
      # revoked at job end. It never enters execution or verification jobs.
      - name: Mint repository-scoped publisher App token
        if: steps.publisher-auth.outputs.mode == 'app'
        id: publisher-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SOFA_PUBLISH_APP_ID }}
          private-key: ${{ secrets.SOFA_PUBLISH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Revalidate issue content, Project Ready revision, and ledger ownership
      # immediately before publication; reconcile an existing intent/PR on retry.
      - name: Revalidate live authority and publish one draft PR with App
        if: steps.publisher-auth.outputs.mode == 'app'
        shell: bash
        env:
          SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
          SOFA_PUBLISH_TOKEN: ${{ steps.publisher-app.outputs.token }}
          SOFA_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ./sofa publish --config consumer/.sofa.yml \
            --manifest transport/manifest.json --bundle candidate/bundle.json \
            --evidence evidence/checks.json --base-branch "$SOFA_BASE_BRANCH"
      - name: Revalidate live authority and publish one draft PR with legacy token
        if: steps.publisher-auth.outputs.mode == 'legacy'
        shell: bash
        env:
          SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
          SOFA_PUBLISH_TOKEN: ${{ secrets.SOFA_PUBLISH_TOKEN }}
          SOFA_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ./sofa publish --config consumer/.sofa.yml \
            --manifest transport/manifest.json --bundle candidate/bundle.json \
            --evidence evidence/checks.json --base-branch "$SOFA_BASE_BRANCH"
