# Consumer entry point: use @v0 for compatible releases, or an exact workflow
# revision and toolkit_sha for candidate testing. The caller serializes runs for its issue and dispatches
# work.reusable.yml only when dispatch is true. This workflow never runs a model.
# Admission captures the trusted issue/Project Ready grant and reserves or
# recovers a fenced attempt in the consumer's sofa-state branch.
name: Sofa / Reusable admission and recovery

on:
  workflow_call:
    inputs:
      issue_number:
        description: Number of the owner-designated issue in the calling repository
        required: true
        type: number
      release_version:
        description: Optional exact Sofa release within v0; omit for automatic updates
        required: false
        default: ''
        type: string
      toolkit_sha:
        description: Optional exact source SHA for secretless candidate testing; omit for released CLIs
        required: false
        default: ''
        type: string
    outputs:
      release_version:
        description: Exact release selected by the admit job; empty in candidate mode
        value: ${{ jobs.admit.outputs.release_version }}
      dispatch:
        description: Whether a new or recoverable attempt was admitted
        value: ${{ jobs.admit.outputs.dispatch }}
      reconcile_publication:
        description: Whether to reuse a candidate from an interrupted publication
        value: ${{ jobs.admit.outputs.reconcile_publication }}
      reconcile_candidate:
        description: Whether to reverify a retained candidate
        value: ${{ jobs.admit.outputs.reconcile_candidate }}
    secrets:
      SOFA_PROJECTS_TOKEN:
        required: true

jobs:
  candidate-build:
    if: inputs.toolkit_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/candidate-build.reusable.yml
    with:
      toolkit_sha: ${{ inputs.toolkit_sha }}
      release_version: ${{ inputs.release_version }}

  admit:
    needs: candidate-build
    name: Admit issue or recover a fenced attempt
    # Only a manual run on the consumer's trusted default branch may admit work.
    # Issue content supplies the task, while configuration comes from that branch.
    if: always() && !cancelled() && (needs.candidate-build.result == 'success' || (needs.candidate-build.result == 'skipped' && inputs.toolkit_sha == '')) && github.event_name == 'workflow_dispatch' && github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Only the trusted controller writes sofa-state.
      actions: read # Reconciliation checks prior run termination before reclaim.
    outputs:
      release_version: ${{ steps.sofa.outputs.release_version }}
      dispatch: ${{ steps.status.outputs.dispatch }}
      reconcile_publication: ${{ steps.status.outputs.reconcile_publication }}
      reconcile_candidate: ${{ steps.status.outputs.reconcile_candidate }}
    steps:
      - name: Validate immutable toolkit reference
        shell: bash
        env:
          SOFA_TOOLKIT_SHA: ${{ inputs.toolkit_sha }}
        run: |
          [[ -z "$SOFA_TOOLKIT_SHA" || "$SOFA_TOOLKIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'toolkit_sha must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Check out consumer configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: consumer
      # Prepare toolkit binaries outside the consumer tree.
      - name: Install released Sofa CLIs
        if: inputs.toolkit_sha == ''
        id: sofa
        uses: kevinmartin/sofa/.github/actions/setup-cli@v0
        with:
          release_version: ${{ inputs.release_version }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download exact candidate binaries from this invocation
        if: inputs.toolkit_sha != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sofa-cli-${{ inputs.toolkit_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sofa-cli
      - name: Verify candidate selection and expose job binaries
        shell: bash
        env:
          SOFA_TOOLKIT_SHA: ${{ inputs.toolkit_sha }}
          SOFA_RELEASE_VERSION: ${{ inputs.release_version }}
          SOFA_RELEASE_BIN: ${{ steps.sofa.outputs.bin_directory }}
        run: |
          if [[ -n "$SOFA_TOOLKIT_SHA" ]]; then
            [[ "$SOFA_TOOLKIT_SHA" =~ ^[0-9a-f]{40}$ && -z "$SOFA_RELEASE_VERSION" ]] || exit 1
            jq -e --arg sha "$SOFA_TOOLKIT_SHA" '.schema == "sofa-candidate-cli-v1" and .source_sha == $sha' "$RUNNER_TEMP/sofa-cli/manifest.json" >/dev/null
            (cd "$RUNNER_TEMP/sofa-cli" && sha256sum --check manifest.sha256)
            chmod 700 "$RUNNER_TEMP/sofa-cli/sofa" "$RUNNER_TEMP/sofa-cli/sofa-test"
          else
            test -n "$SOFA_RELEASE_BIN"
            test "$SOFA_RELEASE_BIN" = "$RUNNER_TEMP/sofa-cli"
          fi
          ln -s "$RUNNER_TEMP/sofa-cli/sofa" ./sofa
          echo "$RUNNER_TEMP/sofa-cli" >> "$GITHUB_PATH"
      - name: Admit the designated issue
        shell: bash
        env:
          SOFA_PROJECTS_TOKEN: ${{ secrets.SOFA_PROJECTS_TOKEN }}
          SOFA_STATE_TOKEN: ${{ github.token }}
          SOFA_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          mkdir -p transport
          ./sofa admit --config consumer/.sofa.yml --issue "$SOFA_ISSUE_NUMBER" --out-dir transport
      # Suppressed or completed issues emit false without producing a worker
      # manifest. Recovery flags describe the checkpoint admitted by the ledger.
      - name: Record dispatch decision
        id: status
        shell: bash
        run: |
          if [[ -f transport/manifest.json ]] && [[ "$(jq -r '.dispatch' transport/status.json)" == true ]]; then
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
            echo "reconcile_publication=$(jq -r '.reconcile_publication // false' transport/status.json)" >> "$GITHUB_OUTPUT"
            echo "reconcile_candidate=$(jq -r '.reconcile_candidate // false' transport/status.json)" >> "$GITHUB_OUTPUT"
          else
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
            echo 'reconcile_publication=false' >> "$GITHUB_OUTPUT"
            echo 'reconcile_candidate=false' >> "$GITHUB_OUTPUT"
          fi
      # Bind transport to this run and attempt so concurrent/retried runs cannot
      # accidentally consume each other's manifest. Artifacts are not authority:
      # later trusted commands revalidate the grant and state fence.
      - name: Carry admitted manifest to work jobs
        if: steps.status.outputs.dispatch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sofa-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: transport/manifest.json
          if-no-files-found: error
          retention-days: 1
